<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBA Report | Living Spring Adventist Academy</title>
    <style>
        :root { --bg: #f8fafc; --card: #ffffff; --primary: #0d9488; --text: #1e293b; --text-light: #64748b; --border: #e2e8f0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); min-height: 100vh; padding: 20px; }
        
        .action-bar { max-width: 1200px; margin: 0 auto 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { padding: 10px 18px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; color: white; text-decoration: none; }
        .btn-print { background: #1e293b; } .btn-primary { background: #0d9488; } .btn-back { background: #64748b; }
        
        .report { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
        .report-header { text-align: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid #0d9488; }
        .report-header h1 { font-size: 20px; color: #0d9488; font-weight: 800; }
        .report-header h2 { font-size: 14px; color: var(--text); margin-top: 4px; }
        .report-info { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; font-size: 13px; }
        .report-info .item { color: var(--text-light); } .report-info .item strong { color: var(--text); }
        
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        table th { background: #0d9488; color: white; padding: 8px 4px; text-align: center; font-size: 9px; text-transform: uppercase; }
        table td { padding: 5px 4px; border: 1px solid var(--border); text-align: center; }
        table td.name { text-align: left; font-weight: 600; width: 120px; }
        .signatures { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 40px; text-align: center; }
        .sig-line { border-top: 1px solid #333; padding-top: 8px; font-size: 12px; }
        
        @media print { body { background: white; padding: 0; } .action-bar { display: none !important; } .report { box-shadow: none; } }
    </style>
</head>
<body>
    <div class="action-bar">
        <button class="btn btn-print" onclick="window.print()">🖨️ Print SBA Sheet</button>
        <a href="sba_entry.html" class="btn btn-primary">📝 Edit Scores</a>
        <a href="index.html" class="btn btn-back">← New Entry</a>
    </div>

    <div class="report">
        <div class="report-header">
            <h1>LIVING SPRING ADVENTIST ACADEMY</h1>
            <h2>SCHOOL BASED ASSESSMENT SHEET</h2>
        </div>
        <div class="report-info">
            <div class="item">👤 <strong id="rptTeacher"></strong></div>
            <div class="item">📖 <strong id="rptSubject"></strong></div>
            <div class="item">🏫 <strong id="rptClass"></strong></div>
            <div class="item">📅 <strong id="rptTerm"></strong></div>
            <div class="item">📆 <strong id="rptYear"></strong></div>
        </div>

        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr><th rowspan="2">SN</th><th rowspan="2">NAME</th><th>TEST 1</th><th>GROUP WORK</th><th>TEST 2</th><th>PROJECT</th><th rowspan="2">SUB TOTAL (60)</th><th rowspan="2">CLASS 50% (A)</th><th rowspan="2">EXAM 100%</th><th rowspan="2">EXAM 50% (B)</th><th rowspan="2">TOTAL 100%</th><th rowspan="2">GRADE</th><th rowspan="2">POS</th><th rowspan="2">REMARKS</th></tr>
                    <tr><th>(15)</th><th>(15)</th><th>(15)</th><th>(15)</th></tr>
                </thead>
                <tbody id="reportBody"></tbody>
            </table>
        </div>

        <div class="signatures">
            <div class="sig-line">Class Teacher's Signature</div>
            <div class="sig-line">Head Teacher's Signature</div>
        </div>
    </div>

    <script>
        window.onload = function() {
            document.getElementById('rptTeacher').textContent = localStorage.getItem('sba_teacher') || '-';
            document.getElementById('rptSubject').textContent = localStorage.getItem('sba_subject') || '-';
            document.getElementById('rptClass').textContent = localStorage.getItem('sba_class') || '-';
            document.getElementById('rptTerm').textContent = localStorage.getItem('sba_term') || '-';
            document.getElementById('rptYear').textContent = localStorage.getItem('sba_year') || '-';

            var data = JSON.parse(localStorage.getItem('sba_data')) || [];
            var tbody = document.getElementById('reportBody');
            if (data.length === 0) { tbody.innerHTML = '<tr><td colspan="14" style="text-align:center;padding:20px;">No SBA data entered yet.</td></tr>'; return; }
            var html = '';
            data.forEach(function(d, i){
                html += '<tr><td>'+(i+1)+'</td><td class="name">'+d.name+'</td><td>'+d.test1+'</td><td>'+d.group+'</td><td>'+d.test2+'</td><td>'+d.project+'</td><td><strong>'+d.subtotal+'</strong></td><td>'+d.classA+'</td><td>'+d.exam+'</td><td>'+d.examB+'</td><td><strong>'+d.total+'</strong></td><td><strong>'+d.grade+'</strong></td><td>'+d.position+'</td><td>'+d.remarks+'</td></tr>';
            });
            tbody.innerHTML = html;
        };
    </script>
</body>
</html>
