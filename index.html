<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBA System | Living Spring Adventist Academy</title>
    <style>
        :root { --bg: #f8fafc; --card: #ffffff; --primary: #0d9488; --primary-dark: #0f766e; --primary-light: #f0fdfa; --text: #1e293b; --text-light: #64748b; --border: #e2e8f0; --success: #059669; --danger: #dc2626; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background: linear-gradient(135deg, #f0fdfa 0%, #ccfbf1 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-card { background: white; border-radius: 24px; padding: 40px; width: 100%; max-width: 440px; box-shadow: 0 25px 60px rgba(0,0,0,0.08); }
        .login-card .school { text-align: center; margin-bottom: 30px; }
        .login-card .school .icon { font-size: 40px; margin-bottom: 8px; }
        .login-card .school h2 { font-size: 16px; color: var(--text); font-weight: 700; }
        .login-card .school h1 { font-size: 20px; color: var(--primary); font-weight: 800; margin-top: 4px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .form-group input, .form-group select { width: 100%; padding: 14px 16px; border: 2px solid var(--border); border-radius: 12px; font-size: 15px; background: #f8fafc; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary); }
        .btn-login { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s; }
        .btn-login:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .footer { text-align: center; color: var(--text-light); font-size: 11px; margin-top: 20px; }
    </style>
    <script>
    var API_URL = 'https://script.google.com/macros/s/AKfycbzsrGrEp7kSLNY9LL0AhE4ZR3_o6kL_NkSCsvePKlpVJ60q8AyNqe18VbXqrG-4Usox/exec';
    
    async function apiGet(action, params) {
        var url = API_URL + '?action=' + action;
        if (params) {
            Object.keys(params).forEach(function(k) { url += '&' + k + '=' + encodeURIComponent(params[k]); });
        }
        try { var r = await fetch(url); return await r.json(); } catch(e) { return []; }
    }
    
    async function apiPost(action, data) {
        try {
            var r = await fetch(API_URL + '?action=' + action + '&data=' + encodeURIComponent(JSON.stringify(data)));
            return await r.json();
        } catch(e) { return { success: false }; }
    }
</script>
</head>
<body>
    <div class="login-card">
        <div class="school">
            <div class="icon">📚</div>
            <h2>Living Spring Adventist Academy</h2>
            <h1>School Based Assessment System</h1>
        </div>
        <div class="form-group"><label>Teacher's Name</label><input type="text" id="teacherName" placeholder="Enter your full name"></div>
        <div class="form-group"><label>Subject</label><input type="text" id="subject" placeholder="e.g., English Language"></div>
        <div class="form-group"><label>Class</label><select id="className"><option value="">Select Class</option><option value="KG 1">KG 1</option><option value="KG 2">KG 2</option><option value="Basic 1">Basic 1</option><option value="Basic 2">Basic 2</option><option value="Basic 3">Basic 3</option><option value="Basic 4">Basic 4</option><option value="Basic 5">Basic 5</option><option value="Basic 6">Basic 6</option><option value="JHS 1">JHS 1</option><option value="JHS 2">JHS 2</option><option value="JHS 3">JHS 3</option></select></div>
        <div class="form-group"><label>Term</label><select id="term"><option value="Term 1">Term 1</option><option value="Term 2">Term 2</option><option value="Term 3">Term 3</option></select></div>
        <div class="form-group"><label>Academic Year</label><input type="text" id="academicYear" value="2025/2026"></div>
        <button class="btn-login" onclick="login()">📝 Enter SBA System</button>
        <div class="footer">© 2025 iTech Systems Solutions</div>
    </div>
    <script>
        function login() {
            var name = document.getElementById('teacherName').value.trim();
            var subject = document.getElementById('subject').value.trim();
            var cls = document.getElementById('className').value;
            if (!name || !subject || !cls) { alert('Fill all fields!'); return; }
            localStorage.setItem('sba_teacher', name);
            localStorage.setItem('sba_subject', subject);
            localStorage.setItem('sba_class', cls);
            localStorage.setItem('sba_term', document.getElementById('term').value);
            localStorage.setItem('sba_year', document.getElementById('academicYear').value);
            window.location.href = 'sba_entry.html';
        }
    </script>
</body>
</html>
